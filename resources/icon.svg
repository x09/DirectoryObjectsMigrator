<?xml version="1.0" encoding="UTF-8"?>
<!--
  Directory Objects Migrator - application icon

  Two stacks of directory objects with a transfer arrow between them: the left
  stack (source, Microsoft AD) is solid blue, the right one (destination, Samba
  AD) is green and partly filled, conveying "being populated".

  Deliberately kept to few, large shapes: an earlier version used dashed outlines
  and thin hierarchy connectors, which turned into unreadable noise once the
  desktop scaled the icon down to 16-24 px. Solid blocks survive that.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#2C6CAE"/>
    </linearGradient>
    <linearGradient id="dst" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ECB7B"/>
      <stop offset="100%" stop-color="#3B8E48"/>
    </linearGradient>
  </defs>

  <!-- Source: three stacked objects, all present -->
  <g>
    <rect x="5"  y="11" width="19" height="9" rx="2.5" fill="url(#src)"/>
    <rect x="5"  y="23" width="19" height="9" rx="2.5" fill="url(#src)"/>
    <rect x="5"  y="35" width="19" height="9" rx="2.5" fill="url(#src)"/>
  </g>

  <!-- Transfer arrow: the single strongest element, so the icon reads as movement -->
  <g>
    <rect x="26" y="25.2" width="10" height="5.6" rx="2.8" fill="#C4612F"/>
    <path d="M34 20.5 L44 28 L34 35.5 Z" fill="#C4612F"/>
  </g>

  <!-- Destination: same stack, last slot still empty (migration in progress) -->
  <g>
    <rect x="45" y="11" width="14" height="9" rx="2.5" fill="url(#dst)"/>
    <rect x="45" y="23" width="14" height="9" rx="2.5" fill="url(#dst)"/>
    <rect x="45" y="35" width="14" height="9" rx="2.5"
          fill="none" stroke="#3B8E48" stroke-width="2.4" opacity="0.65"/>
  </g>
</svg>
